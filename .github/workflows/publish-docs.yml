name: Build Docs (docs_source)

env:
  PYTHON_VERSION: '3.10'

on:
  pull_request:
    branches: [ "main" ]
    types:
      - closed
  workflow_dispatch:

jobs:
  build-and-deploy-docs:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book==0.15.1 ghp-import
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build Docs
        run: |
          jupyter-book clean docs_source --all
          jupyter-book build docs_source
      - name: Deploy Docs build to GitHub Pages
        run: |
          ghp-import -n -p -f docs_source/_build/html