model:
  input_size: 1
  hidden_size: 32
  output_size: 1
  layer_count: 3
  freq: 10
  activation: tanh
  activation_init: 0.6
  use_mask: true

physics:
  m: 2
  k: 200
  c: 2
  x0: 0.5
  v0: 0.0
  alpha_actual: 0.45
  T: 20.0
  tau_actual: 4.0
  dt: 0.01
  force_mag: 1.0

training:
  seed: 123
  mode: alpha
  alpha_steps: 10000
  tau_steps: 10000
  resume_path: null
  alpha_init: 0.9
  tau_init: 13.0
  clamp_min: 0.1
  clamp_max: 0.99
  lr_pinn: 0.001
  lr_tau: 0.075
  lr_alpha: 0.001
  lam1: 0.0001
  lam2: 0.1
  noise_std: 0.02
  t_phy_points: 2000
  t_test_points: 1000
  t_obs_points: 1000

artifacts:
  save_dir: .
  fps: 10
  fig_size: [15, 20]
  plot_every: 39
  gif_every: 78
  ckpt_every: 499
  jpg_alpha_name: "Inverse_alpha_mask_{alpha_actual}_{mode}.jpg"
  jpg_tau_name: "Inverse_tau_mask_{alpha_actual}_{tau_actual}_{mode}.jpg"
  gif_name: "animation_Inverse_alpha_mask_{alpha_actual}_{mode}.gif"
  pth_name: "batch_alpha_inverse_{alpha_actual}_{mode}.pth"
  pth_alpha_name: "batch_alpha_inverse_{alpha_actual}_{mode}_alpha.pth"
  pth_tau_name: "batch_alpha_inverse_{alpha_actual}_{mode}_tau.pth"